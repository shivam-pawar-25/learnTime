<body>
    <header>
        <nav>
            <div class="logo">EduLearn</div>

    <section class="contact">
        <div class="contact-form-card">
            <h2>Contact Us</h2>
            <form id="contact-form" action="YOUR_FORM_HANDLER_URL" method="POST">  <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Submit</button>
            </form>
            <div id="success-message"></div>
        </div>
    </section>

    <footer>
        <div class="contact-info">
            <a href="tel:+91-YOUR-NUMBER"><i class="fas fa-phone"></i> +91-YOUR-NUMBER</a>
            <div class="social-links">
                <a href="https://www.instagram.com/YOUR_INSTAGRAM_USERNAME" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://github.com/YOUR_GITHUB_USERNAME" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://www.facebook.com/YOUR_FACEBOOK_USERNAME" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://twitter.com/YOUR_TWITTER_USERNAME" target="_blank"><i class="fab fa-twitter"></i></a>
            </div>
